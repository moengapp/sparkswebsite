<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure Escape SA | Project Overview</title>
  
</head>
<body>

<div class="screen-frame">
        <!-- Header Navigation -->
        <header class="navbar">
            <div class="nav-logo"></div>
            <div class="nav-links">
                <span>HOME</span>
                <span>ABOUT US</span>
                <span>PACKAGES</span>
                <span>FEES</span>
                <span>CONTACT US</span>
            </div>
        </header>

        <!-- Overview Section -->
        <section class="overview-section">
            <div class="section-tag">OVERVIEW</div>
            <div class="overview-card">
                <div class="overview-text">
                    Outdoor adventure activity that allows participants and families to glide along and enjoy their days and holidays.
                </div>
                <div class="overview-thumb"></div>
            </div>
        </section>

        <!-- Filters Bar -->
        <div class="filters-bar">
            <span class="filter-label">FILTERS</span>
            <button class="filter-btn">ALL</button>
            <button class="filter-btn">PACKAGES</button>
            <button class="filter-btn">BOOKINGS</button>
            <button class="filter-btn">FEES</button>
        </div>

        <!-- Pro Tip Section -->
        <div class="pro-tip">
            <div class="pro-tip-title">PRO TIP:</div>
            <div class="pro-tip-desc">2023 MULTIPLE PACKAGES - COMPRESS ALL FEES ON THE TAG</div>
        </div>

        <!-- Gallery Grid (Matching layout structure) -->
        <div class="gallery-grid">
            <div class="gallery">
                <div class="view-badge">VIEW</div>
            </div>
            <div class="gallery">
                <div class="view-badge">VIEW</div>
            </div>
            <div class="gallery" style="margin-top: -30px;">
                <div class="view-badge">VIEW</div>
            </div>
            <div class="gallery" style="margin-top: -60px;">
                <div class="view-badge">VIEW</div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <div class="page-box active">1</div>
            <div class="page-box">2</div>
            <div class="page-box">3</div>
            <div class="page-box">4</div>
            <div class="page-box">5</div>
        </div>
    </div>


</body>
</html>
